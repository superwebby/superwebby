name: release

# Builds Superwebby for Windows, macOS (Apple Silicon + Intel) and Linux, smoke-tests each
# build headlessly, and attaches everything to the GitHub release for the tag.
# Builds are NOT signed with a paid certificate: Windows SmartScreen and macOS Gatekeeper
# will warn on first launch (see README).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  PYTHON_VERSION: "3.13"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build deps
        run: python -m pip install -r packaging/requirements-build.txt
      - name: PyInstaller onedir
        run: python packaging/pyi_build.py
      - name: Smoke test (portable build)
        run: python packaging/ci-smoke.py dist/superwebby/superwebby.exe windows-x64
      - name: Portable zip
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item README.md, LICENSE dist/superwebby/
          Compress-Archive -Path dist/superwebby -DestinationPath "release/superwebby-$v-windows-x64-portable.zip" -CompressionLevel Optimal
      - name: Inno Setup installer
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe).Source }
          & $iscc "/DMyAppVersion=$v" "/DSourceDir=$PWD\dist\superwebby" "/DOutDir=$PWD\release" packaging\windows\superwebby.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test (silent install, then run the installed copy)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $p = Start-Process -FilePath "release\superwebby-$v-windows-x64-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$env:LOCALAPPDATA\Programs\Superwebby" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          python packaging/ci-smoke.py "$env:LOCALAPPDATA\Programs\Superwebby\superwebby.exe" windows-x64-installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows-x64
          path: |
            smoke-*.json
            selftest-*.png

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build deps
        run: python -m pip install -r packaging/requirements-build.txt
      - name: PyInstaller .app (ad-hoc codesigned)
        run: python packaging/pyi_build.py
      - name: Check architecture
        run: |
          file dist/Superwebby.app/Contents/MacOS/Superwebby
          lipo -archs dist/Superwebby.app/Contents/MacOS/Superwebby
      - name: Smoke test (.app)
        run: python packaging/ci-smoke.py dist/Superwebby.app/Contents/MacOS/Superwebby macos-${{ matrix.arch }}
      - name: Build .dmg
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          mkdir -p release dmg-stage
          cp -R dist/Superwebby.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Superwebby $V" -srcfolder dmg-stage -ov -format UDZO \
            "release/superwebby-$V-macos-${{ matrix.arch }}.dmg"
          codesign --force --sign - "release/superwebby-$V-macos-${{ matrix.arch }}.dmg"
      - name: Smoke test (app copied out of the mounted .dmg)
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "release/superwebby-$V-macos-${{ matrix.arch }}.dmg"
          rm -rf "$HOME/Applications/Superwebby.app"; mkdir -p "$HOME/Applications"
          cp -R "$MNT/Superwebby.app" "$HOME/Applications/"
          hdiutil detach "$MNT"
          codesign --verify --deep --strict "$HOME/Applications/Superwebby.app"
          python packaging/ci-smoke.py "$HOME/Applications/Superwebby.app/Contents/MacOS/Superwebby" macos-${{ matrix.arch }}-from-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-macos-${{ matrix.arch }}
          path: |
            smoke-*.json
            selftest-*.png

  linux:
    # 22.04: older glibc (wider compatibility) and no AppArmor userns restriction,
    # so the Chromium sandbox can start during the smoke test.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: System libraries for Qt WebEngine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libnss3 \
            libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-image0 libxcb-render-util0 libgtk-3-0
      - name: Install build deps
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Binary tarball (PyInstaller onedir, stripped)
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          mkdir -p release
          PYTHON=python bash packaging/build-bin.sh "$PWD/packaging/out" "$PWD/release/superwebby-$V-x86_64.tar.gz"
          bash packaging/build-source-tarball.sh "$PWD/release/superwebby-$V.tar.gz"
      - name: Smoke test
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          python packaging/ci-smoke.py "packaging/out/superwebby-$V-x86_64/superwebby-app/superwebby" linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux-x86_64
          path: |
            smoke-*.json
            selftest-*.png

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          mkdir -p upload
          find artifacts -mindepth 2 -maxdepth 2 -type f ! -path 'artifacts/smoke-*' -exec cp {} upload/ \;
          mkdir -p smoke && cp artifacts/smoke-*/smoke-*.json smoke/ 2>/dev/null || true
          (cd smoke && tar czf ../upload/ci-smoke-reports.tar.gz .)
          ls -la upload
      - name: Create release if missing, then upload
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Superwebby ${TAG#v}" --notes "Automated build for $TAG. See README for install steps."
          fi
          # Merge with any checksums already on the release (e.g. the Flatpak uploaded separately).
          gh release download "$TAG" -p SHA256SUMS -D existing 2>/dev/null || true
          (cd upload && sha256sum * > ../ci-sums)
          if [ -f existing/SHA256SUMS ]; then
            awk 'NR==FNR{n[$2]=1; next} !($2 in n)' ci-sums existing/SHA256SUMS > keep || true
            cat ci-sums keep | sort -k2 > upload/SHA256SUMS
          else
            sort -k2 ci-sums > upload/SHA256SUMS
          fi
          cat upload/SHA256SUMS
          gh release upload "$TAG" upload/* --clobber
